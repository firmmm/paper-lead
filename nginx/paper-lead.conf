# Paper Lead — reverse proxy (single entry point, port 80)
#
#   http://<host>/...   -> api  (REST + Swagger /docs)
#   http://<host>/mcp   -> mcp  (streamable HTTP, SSE-safe)
#
# Upstreams resolve via docker's embedded DNS (127.0.0.11) and are
# re-resolved every 10s, so container restarts (new IPs) never leave
# nginx pointing at a stale address.
#
# Future: when a real DNS name exists, add server_name + TLS here.

server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # MCP streamable HTTP — must not buffer (SSE responses),
    # long timeouts for agent sessions.
    location = /mcp {
        set $mcp_upstream http://mcp:9000/mcp;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else -> REST API (incl. /docs, /openapi.json, /export...)
    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
