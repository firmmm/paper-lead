name: paper-lead

# Microservice layout:
#   proxy  — nginx entry point, port 80: / -> api, /mcp -> mcp
#   api    — long-running FastAPI (read-only KB service), port 8000
#   mcp    — MCP server for AI clients, port 9000
#   ingest — one-shot daily worker (fetch → rank → summarize → publish → parse KB)
#            started by the OpenClaw cron: `docker compose run --rm ingest`
#
# Both services share ONE image (ppl:v0.1.0), built from the api
# service. This is deliberate: `docker compose build` does not build
# profile-gated services, so a separate ingest build would silently go stale.
#
# SQLite (data/) and digests (digest/) are host bind mounts, so state stays
# on the host and every service shares the same DB file.

services:
  api:
    build: .
    image: ppl:v0.1.0      # the single shared image both services run
    container_name: paper-lead-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # sqlite KB; api opens it mode=ro in code
      - ./digest:/app/digest      # raw digest markdown for /digests/{day}/raw
      - ./papers_pdf:/app/papers_pdf:ro  # archived paper PDFs for /papers/{id}/pdf
      - ./.env:/app/.env:ro       # KB_API_KEY
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ingest:
    image: ppl:v0.1.0      # same image as api — never built separately
    profiles: ["tools"]           # never started by `up -d`; run via `compose run`
    volumes:
      - ./data:/app/data
      - ./digest:/app/digest
      - ./papers_pdf:/app/papers_pdf   # archive new PDFs daily
      - ./config.yaml:/app/config.yaml:ro
      - ./interests.yaml:/app/interests.yaml:ro
      - ./.env:/app/.env:ro       # GATEWAY_API_KEY, DISCORD_WEBHOOK
    # Daily job: digest pipeline + KB refresh + PDF top-up in one run
    command: sh -c "python -m src.main --config config.yaml && python -m src.parse_digests && python -m src.fetch_pdfs --limit 30"

  mcp:
    image: ppl:v0.1.0      # same shared image
    container_name: paper-lead-mcp
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data          # sqlite KB, read-only in code
      - ./.env:/app/.env:ro
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    restart: unless-stopped
    command: ["python", "-m", "src.mcp_server"]

  proxy:
    image: nginx:alpine
    container_name: paper-lead-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/paper-lead.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - mcp
    restart: unless-stopped
    # Single entry point: http://<host>/ -> REST api, http://<host>/mcp -> MCP.
    # Direct ports 8000/9000 stay exposed for existing clients.
