# Paper Lead — example config
# Copy to config.yaml and edit (config.yaml is gitignored)

# arXiv categories to fetch
categories:
  - cs.AI
  - cs.LG
  - cs.CL

# fetch limits
max_results: 100        # arXiv API: max papers per fetch
max_papers: 20          # top-N papers sent to the LLM per day

# date windows (empty = runtime defaults)
date_from: ""           # arXiv: fetch papers published from this date (YYYY-MM-DD)
hf_date: ""             # HuggingFace Daily Papers date (YYYY-MM-DD)

min_score: 0.1          # ranker relevance threshold (0-1)

db_path: data/paper_lead.sqlite3
interests_file: interests.yaml   # ranker keyword profile

llm:
  provider: openai
  model: GEMMA4-26B-A4B-IT
  base_url: https://gateway-llm.siam.ai
  fallbacks:
    - GLM-5.3

delivery:
  file: true
  # slack:
  #   webhook: https://hooks.slack.com/services/...
  # discord:
  #   webhook: https://discord.com/api/webhooks/...

digest:
  output_dir: digest
