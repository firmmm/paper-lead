<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Lead — Data Flow</title>
<style>
  html, body { margin: 0; padding: 24px; background: #ffffff; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  svg { max-width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paper Lead data flow diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ================= connectors (drawn first, sit behind nodes) ================= -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- sources -> fetcher -->
    <path d="M210,167 L262,167 L262,158 L270,158" marker-end="url(#arrow)"/>
    <path d="M210,251 L262,251 L262,176 L270,176" marker-end="url(#arrow)"/>
    <!-- pipeline chain -->
    <path d="M410,167 L440,167" marker-end="url(#arrow)"/>
    <path d="M580,167 L610,167" marker-end="url(#arrow)"/>
    <path d="M760,167 L800,167" marker-end="url(#arrow)"/>
    <!-- publisher -> digest markdown -->
    <path d="M870,194 L870,300" marker-end="url(#arrow)"/>
    <!-- publisher -> sqlite (papers metadata) -->
    <path d="M830,194 L830,236 L640,236 L640,430" marker-end="url(#arrow)"/>
    <!-- publisher -> telegram (notify, dashed) -->
    <path d="M940,167 L980,167" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <!-- digest md -> parser -->
    <path d="M790,332 L490,332" marker-end="url(#arrow)"/>
    <!-- parser -> sqlite (KB tables) -->
    <path d="M395,364 L395,505 L560,505" marker-end="url(#arrow)"/>
    <!-- sqlite -> api -->
    <path d="M900,470 L940,470" marker-end="url(#arrow)"/>
    <!-- api -> clients -->
    <path d="M1080,510 L1080,560" marker-end="url(#arrow)"/>
  </g>

  <!-- connector labels -->
  <g font-size="11.5" fill="#64748b">
    <text x="640" y="226" text-anchor="middle">papers + abstracts (mark_seen)</text>
    <text x="640" y="324" text-anchor="middle">reads daily summaries</text>
    <text x="404" y="494" text-anchor="start">digest_days + digest_entries + FTS</text>
    <text x="948" y="156" text-anchor="middle">daily digest</text>
    <text x="918" y="462" text-anchor="middle">SQL</text>
  </g>

  <!-- ================= group: daily ingest ================= -->
  <rect x="250" y="108" width="710" height="112" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="258" y="134" font-size="12" fill="#64748b">container: paper-lead-ingest · docker compose run --rm ingest · cron 09:00 ICT</text>

  <!-- ================= nodes ================= -->
  <!-- input: sources -->
  <g>
    <rect x="40" y="140" width="170" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">arXiv API</text>
    <text x="125" y="181" text-anchor="middle" font-size="11.5" fill="#475569">cs.AI · cs.LG · cs.CL</text>
    <rect x="40" y="224" width="170" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="247" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">HF Daily Papers</text>
    <text x="125" y="265" text-anchor="middle" font-size="11.5" fill="#475569">daily top papers</text>
  </g>

  <!-- process: pipeline -->
  <g>
    <rect x="270" y="140" width="140" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="340" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Fetcher</text>
    <text x="340" y="181" text-anchor="middle" font-size="11.5" fill="#475569">fetch + dedupe</text>
    <rect x="440" y="140" width="140" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="510" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Ranker</text>
    <text x="510" y="181" text-anchor="middle" font-size="11.5" fill="#475569">interests.yaml score</text>
    <rect x="610" y="140" width="150" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="685" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Summarizer</text>
    <text x="685" y="181" text-anchor="middle" font-size="11.5" fill="#475569">LLM · Thai summaries</text>
    <rect x="800" y="140" width="140" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="870" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Publisher</text>
    <text x="870" y="181" text-anchor="middle" font-size="11.5" fill="#475569">markdown + delivery</text>
  </g>

  <!-- external: telegram -->
  <g>
    <rect x="980" y="140" width="240" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1100" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">F — Telegram</text>
    <text x="1100" y="181" text-anchor="middle" font-size="11.5" fill="#475569">daily digest delivery</text>
  </g>

  <!-- storage: digest markdown -->
  <g>
    <rect x="790" y="300" width="170" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="875" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">digest/*.md</text>
    <text x="875" y="345" text-anchor="middle" font-size="11.5" fill="#475569">118 daily files · Thai</text>
  </g>

  <!-- process: parser -->
  <g>
    <rect x="300" y="300" width="190" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="395" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">parse_digests.py</text>
    <text x="395" y="345" text-anchor="middle" font-size="11.5" fill="#475569">KB builder · same ingest run</text>
  </g>

  <!-- storage: sqlite -->
  <g>
    <rect x="560" y="430" width="340" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="730" y="458" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">SQLite — data/paper_lead.sqlite3</text>
    <text x="730" y="482" text-anchor="middle" font-size="12" fill="#475569">papers — 2,255 rows · abstracts, authors</text>
    <text x="730" y="502" text-anchor="middle" font-size="12" fill="#475569">digest_days — 118 · digest_entries — 1,132</text>
    <text x="730" y="522" text-anchor="middle" font-size="12" fill="#475569">summary/why/opinion per paper</text>
    <text x="730" y="548" text-anchor="middle" font-size="12" fill="#475569">FTS5: papers_fts + entries_fts</text>
  </g>

  <!-- api container frame (dashed) -->
  <rect x="930" y="405" width="300" height="120" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="938" y="420" font-size="12" fill="#64748b">container: paper-lead-api · always on (restart unless-stopped)</text>

  <!-- process: api -->
  <g>
    <rect x="940" y="430" width="280" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1080" y="456" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">FastAPI KB API</text>
    <text x="1080" y="476" text-anchor="middle" font-size="12" fill="#475569">docker: paper-lead-api · port 8000</text>
    <text x="1080" y="496" text-anchor="middle" font-size="12" fill="#475569">read-only (mode=ro) · X-API-Key · /docs</text>
  </g>

  <!-- external: clients -->
  <g>
    <rect x="940" y="560" width="280" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1080" y="585" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Team &amp; external consumers</text>
    <text x="1080" y="605" text-anchor="middle" font-size="11.5" fill="#475569">GET /papers /digests /search /stats</text>
  </g>

  <!-- ================= title + legend ================= -->
  <text x="640" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Paper Lead — Data Flow (Microservices)</text>
  <text x="640" y="66" text-anchor="middle" font-size="13" fill="#64748b">ingest pipeline → markdown digests + SQLite knowledge base → read-only API</text>

  <g font-size="12" fill="#475569">
    <rect x="40" y="660" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="66" y="674">input</text>
    <rect x="130" y="660" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="156" y="674">process</text>
    <rect x="228" y="660" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="254" y="674">storage</text>
    <rect x="326" y="660" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="352" y="674">external</text>
    <text x="440" y="674">solid = data · dashed = notification · dashed frame = docker container</text>
  </g>
</svg>
</body>
</html>
